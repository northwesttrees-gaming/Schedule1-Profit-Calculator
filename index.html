<!DOCTYPE html>
<html>
  <head>
    <title> Schedule 1 Profit Calculato </title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>

    <h1> Schedule 1 Profit Calculator </h1>
    <p> Calculates the true profit of your product. </p>

    <h2 id="product-type"> Product Type </h2>
    <p> Select your product type below </p>

    <form>
      <input type="radio" id="ogkush" name="products" value="OG Kush" data-product-cost="30">
      <label for="ogkush"> OG Kush </label><br>
      <input type="radio" id="sourdiesel" name="products" value="Sour Diesel" data-product-cost="35">
      <label for="sourdiesel"> Sour Diesel </label><br>
      <input type="radio" id="greencrack" name="products" value="Green Crack" data-product-cost="40">
      <label for="greencrack"> Green Crack </label><br>
      <input type="radio" id="granddaddypurple" name="products" value="Granddaddy Purple" data-product-cost="45">
      <label for="granddaddypurple"> Granddaddy Purple </label><br>
      <input type="radio" id="poorqualitymeth" name="products" value="Poor Quality Meth" data-product-cost="140">
      <label for="poorqualitymeth"> Poor Quality Meth </label><br>
      <input type="radio" id="standardqualitymeth" name="products" value="Standard Quality Meth" data-product-cost="160">
      <label for="standardqualitymeth"> Standard Quality Meth </label><br>
      <input type="radio" id="highqualitymeth" name="products" value="High Quality Meth" data-product-cost="190">
      <label for="highqualitymeth"> High Quality Meth </label><br>
      <input type="radio" id="shrooms" name="products" value="Shrooms" data-product-cost="200">
      <label for="shrooms"> Shrooms </label><br>
      <input type="radio" id="cocaine" name="products" value="Cocaine" data-product-cost="0">
      <label for="cocaine"> Cocaine </label><br>
    </form>

    <h3> Result </h3>
    <table>
      <tr>
        <th> Details </th>
        <th> Value </th>
      </tr>
      <tr>
        <td class="tdh"> Product cost: </td>
        <td id="productcost"></td>
      </tr>
    </table>
    <script src="script.js"></script>
  </body>
</html>
